name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
      TMPDIR: ${{ github.workspace }}/.tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Prepare local scratch directories
        run: mkdir -p .tmp .cache
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Test frozen-model contracts
        run: python -m pytest -q --basetemp=.tmp/pytest
      - name: Synthetic CPU smoke
        run: python smoke.py --output-dir .tmp/smoke
      - name: Verify release data and package hashes
        run: python tools/check_release.py
